<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Dark Navy Badge -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#badgeGrad)" stroke="#334155" stroke-width="2" />
  
  <!-- Subtle Glow Layer -->
  <rect x="12" y="12" width="96" height="96" rx="20" fill="none" stroke="url(#qrGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4" />
  
  <!-- Top-Left Finder Pattern -->
  <rect x="22" y="22" width="28" height="28" rx="7" fill="none" stroke="url(#qrGrad)" stroke-width="5" />
  <rect x="30" y="30" width="12" height="12" rx="3" fill="#38BDF8" />

  <!-- Top-Right Finder Pattern -->
  <rect x="70" y="22" width="28" height="28" rx="7" fill="none" stroke="url(#qrGrad)" stroke-width="5" />
  <rect x="78" y="30" width="12" height="12" rx="3" fill="#38BDF8" />

  <!-- Bottom-Left Finder Pattern -->
  <rect x="22" y="70" width="28" height="28" rx="7" fill="none" stroke="url(#qrGrad)" stroke-width="5" />
  <rect x="30" y="78" width="12" height="12" rx="3" fill="#38BDF8" />

  <!-- Data Matrix Dots & Spark Tech Accent -->
  <rect x="58" y="24" width="6" height="12" rx="2" fill="#FFFFFF" opacity="0.9" />
  <rect x="58" y="42" width="6" height="6" rx="2" fill="#38BDF8" />
  <rect x="24" y="56" width="12" height="6" rx="2" fill="#FFFFFF" opacity="0.9" />
  <rect x="42" y="56" width="6" height="6" rx="2" fill="#38BDF8" />
  
  <rect x="56" y="56" width="10" height="10" rx="3" fill="url(#qrGrad)" />
  <rect x="72" y="58" width="8" height="8" rx="2.5" fill="#FFFFFF" />
  <rect x="88" y="58" width="8" height="6" rx="2" fill="#38BDF8" opacity="0.9" />
  
  <rect x="58" y="72" width="6" height="10" rx="2" fill="#FFFFFF" />
  <rect x="58" y="88" width="6" height="8" rx="2" fill="#38BDF8" />
  <rect x="72" y="74" width="22" height="22" rx="6" fill="#2563EB" opacity="0.2" />
  
  <!-- Modern Center Spark Scan Beam Dot -->
  <circle cx="83" cy="85" r="4.5" fill="#38BDF8" />
  <path d="M83 77 L83 93 M75 85 L91 85" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
</svg>
